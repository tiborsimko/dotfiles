# Tibor's Alacritty configuration.

[general]
import = ["theme-light.toml", "theme-current.toml"]

[env]
TERM = "alacritty"
LANG = "en_GB.UTF-8"
LC_ALL = "en_GB.UTF-8"

[terminal]
shell = { program = "/bin/zsh", args = [
  "-l",
  "-c",
  "exec env -u TMUX tmux new-session",
] }

# Set terminal font.
[font]
size = 18
# normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
# normal = { family = "FiraCode Nerd Font", style = "Regular" }
# normal = { family = "AporeticSansMonoNerdFont", style = "Regular" }
normal = { family = "IosevkaTerm Nerd Font", style = "Regular" }
# normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
# normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }

# Keep mouse URL opening; Tmux-Fingers handles keyboard picking after rejoining
# soft-wrapped pane lines.
[[hints.enabled]]
regex = """(https:|http:)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"""
hyperlinks = true
command = "open"
post_processing = true
mouse = { enabled = true }

# Send a distinct Shift+Return sequence for terminal apps that support
# modified keys, including Codex's `shift-enter` keymap.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# Make Yanking to also immediately exit Vi mode
[[keyboard.bindings]]
action = "Copy"
key = "Y"
mode = "Vi"

[[keyboard.bindings]]
action = "ClearSelection"
key = "Y"
mode = "Vi"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "Y"
mode = "Vi"

# Increase font size with either macOS zoom-in spelling
[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "="
mods = "Command"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "+"
mods = "Command|Shift"

# Decrease font size
[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "-"
mods = "Command"

# Reset font size (Cmd-0 is reserved for tmux)
[[keyboard.bindings]]
action = "ResetFontSize"
key = ")"
mods = "Command|Shift"

# Tmux-Fingers picker table (Cmd-Y -> Prefix-y)
[[keyboard.bindings]]
chars = "\u0000y"
key = "Y"
mods = "Command"

# Tmux helper: switch to last session
[[keyboard.bindings]]
chars = "\u0000s"
key = "S"
mods = "Command"

# Tmux helper: switch to any session (Cmd-P, like Mattermost/Slack quick switcher)
[[keyboard.bindings]]
chars = "\u0000p"
key = "P"
mods = "Command"

# Tmux helper: jump to the most recent alert across all sessions
[[keyboard.bindings]]
chars = "\u0000I"
key = "I"
mods = "Command"

# Tmux helper: create new tab
[[keyboard.bindings]]
chars = "\u0000t"
key = "T"
mods = "Command"

# Tmux helper: switch to alternate window
[[keyboard.bindings]]
chars = "\u00000"
key = "0"
mods = "Command"

# Tmux helper: focus window 1
[[keyboard.bindings]]
chars = "\u00001"
key = "1"
mods = "Command"

# Tmux helper: focus window 2
[[keyboard.bindings]]
chars = "\u00002"
key = "2"
mods = "Command"

# Tmux helper: focus window 3
[[keyboard.bindings]]
chars = "\u00003"
key = "3"
mods = "Command"

# Tmux helper: focus window 4
[[keyboard.bindings]]
chars = "\u00004"
key = "4"
mods = "Command"

# Tmux helper: focus window 5
[[keyboard.bindings]]
chars = "\u00005"
key = "5"
mods = "Command"

# Tmux helper: focus window 6
[[keyboard.bindings]]
chars = "\u00006"
key = "6"
mods = "Command"

# Tmux helper: focus window 7
[[keyboard.bindings]]
chars = "\u00007"
key = "7"
mods = "Command"

# Tmux helper: focus window 8
[[keyboard.bindings]]
chars = "\u00008"
key = "8"
mods = "Command"

# Tmux helper: focus window 9
[[keyboard.bindings]]
chars = "\u00009"
key = "9"
mods = "Command"

# Tmux helper: previous session
[[keyboard.bindings]]
chars = "\u0000("
key = "LBracket"
mods = "Command"

# Tmux helper: next session
[[keyboard.bindings]]
chars = "\u0000)"
key = "RBracket"
mods = "Command"

# Tmux helper: previous window
[[keyboard.bindings]]
chars = "\u0000N"
key = "{"
mods = "Command|Shift"

# Tmux helper: next window
[[keyboard.bindings]]
chars = "\u0000n"
key = "}"
mods = "Command|Shift"

# Tmux helper: split pane side-by-side (Cmd-d -> prefix |)
[[keyboard.bindings]]
chars = "\u0000|"
key = "D"
mods = "Command"

# Tmux helper: split pane stacked (Cmd-Shift-d -> prefix -)
[[keyboard.bindings]]
chars = "\u0000-"
key = "D"
mods = "Command|Shift"

# Tmux helper: focus pane left (Cmd-h, via Karabiner F18 remap; sends raw C-h for smart routing)
[[keyboard.bindings]]
chars = "\u0008"
key = "F18"

# Tmux helper: focus pane down (Cmd-j, sends raw C-j for smart routing)
[[keyboard.bindings]]
chars = "\u000a"
key = "J"
mods = "Command"

# Tmux helper: focus pane up (Cmd-k, sends raw C-k for smart routing)
[[keyboard.bindings]]
chars = "\u000b"
key = "K"
mods = "Command"

# Tmux helper: focus pane right (Cmd-l, sends raw C-l for smart routing)
[[keyboard.bindings]]
chars = "\u000c"
key = "L"
mods = "Command"

# Tmux helper: switch to any pane or create a new session (Cmd-G -> C-Space g)
[[keyboard.bindings]]
chars = "\u0000g"
key = "G"
mods = "Command"

# Tmux helper: zoom pane (Cmd-Z -> C-Space z)
[[keyboard.bindings]]
chars = "\u0000z"
key = "Z"
mods = "Command"

# Tmux helper: enter copy mode (search/scroll/yank)
[[keyboard.bindings]]
chars = "\u0000f"
key = "F"
mods = "Command"

[cursor]
thickness = 0.22

[cursor.style]
shape = "Beam"

[selection]
save_to_clipboard = true

[window]
decorations = "None"
dynamic_padding = true
option_as_alt = "Both"

[window.padding]
y = 4
x = 4

# Tibor's tmux configuration.

# Prefix: Ctrl-Space
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Reload config (handy for toggling flags above).
bind-key r source-file ~/.config/tmux/tmux.conf

# Force a client redraw (tmux's default `prefix r`, relocated to capital R).
bind-key R refresh-client

# Set shell
# set-option -g default-shell /opt/homebrew/bin/bash
set-option -g default-command "${SHELL}"

# Use vi mode
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Use v to start selection (alongside default Space)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

# Use y to yank selection (alongside default Return)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Disable ESC key delay
set -sg escape-time 0

# Focus events
set -g focus-events on

# Set window title to current working directory
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{s/zsh//:pane_current_command},#{s/zsh//:pane_current_command},#{b:pane_current_path}}'
# set-option -g automatic-rename-format '#{?#{s/bash//:pane_current_command},#{s/bash//:pane_current_command},#{b:pane_current_path}}'

# Set clipboard
set-window-option -g set-clipboard on

# Enable mouse mode for full mouse support (single click: select pane, double
# click: select word, triple click: select line, drag borders: resize panes)
set -g mouse on

# Configure word separators to match Alacritty's semantic_escape_chars
# defaults. This ensures double-click word selection behaves identically in
# tmux and Alacritty.
set -g word-separators ",│\`|:\"' ()[]{}<>\t"

# Override default double/triple-click behavior to reduce flash time
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.05 ; send-keys -X copy-pipe-and-cancel }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.05 ; send-keys -X copy-pipe-and-cancel }

# Increase scrollback buffer size
set -g history-limit 100000

# Start numbering windows and panes at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Enable WM window titles for easier switching
set-option -g set-titles on
set-option -g set-titles-string '[#S] #T'

# Enable colourful terminal
set -s default-terminal 'tmux-256color'
set -as terminal-overrides ',alacritty:RGB'

# Preserve modified-key sequences such as Shift+Enter for terminal clients.
# `always` is needed for clients that do not request modifyOtherKeys themselves.
# Requires tmux 3.4+; older versions (e.g. Debian 12's 3.3a) silently skip.
%if #{>=:#{version},3.4}
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',alacritty:extkeys'
%endif

set-option -g bell-action any
set-option -g visual-bell off

# Source theme configuration
source-file ~/.config/tmux/theme-light.conf
# Local override generated by theme-toggle; absent on a fresh installation.
source-file -q ~/.config/tmux/theme-current.conf

# Status bar positioning and layout
set-option -g status-position top
set-option -g status-justify left
set-option -g status-left-length 40
set-option -g status-right ''
set-option -g window-status-format '#I:#W#F'
set-option -g window-status-current-format '#I:#W#F'

# Switch to last known session when exiting
set-option -g detach-on-destroy off

# Switch cursor to block in copy mode, restore beam when leaving
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'
set-hook -g pane-mode-changed 'if-shell -F "#{pane_in_mode}" "set cursor-style block" "set cursor-style bar"'

# Windows: open new window in same directory
bind-key c new-window -c '#{pane_current_path}'
bind-key t new-window -c '#{pane_current_path}'

# Panes: focus with vi-style hjkl (k now joins the family)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Panes: directional swap with prefix-Shift-hjkl
bind-key H swap-pane -t '{left-of}'
bind-key J swap-pane -t '{down-of}'
bind-key K swap-pane -t '{up-of}'
bind-key L swap-pane -t '{right-of}'

# Panes: resize with prefix-arrows (repeatable)
bind-key -r Up    resize-pane -U 3
bind-key -r Down  resize-pane -D 3
bind-key -r Left  resize-pane -L 5
bind-key -r Right resize-pane -R 5

# Panes: rebalance to an even grid
bind-key = select-layout tiled

# Panes: copy-mode-vi navigation (only fires inside copy mode)
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Panes: open splits in same directory
bind-key -r | split-window -h -c '#{pane_current_path}'
bind-key -r - split-window -v -c '#{pane_current_path}'

# Org-capture: split pane and open emacsclient org-capture
bind-key C split-window -h "emacsclient -t -e '(org-capture)'"

# Display clock
bind-key T clock-mode

# Windows: previous/next window
bind-key N previous-window
bind-key n next-window

# Windows: switch back and forth to the alternate (last focused) window.
# Alacritty Cmd-0 fires this via prefix-0.
bind-key 0 last-window

# Windows: swap left/right in the window list
bind-key < swap-window -t -1
bind-key > swap-window -t +1

# Fuzzy pane switcher: find any pane by command name or directory
bind-key "w" run-shell "~/.config/tmux/select-pane.sh"
bind-key "W" choose-tree -Zw

# Switch to last used session (mnemonic match for Cmd-S)
bind-key s switch-client -l

# tmux's default `prefix s` (choose-tree session picker) moved to capital S
bind-key S choose-tree -Zs

# Fuzzy session switcher (alacritty Cmd-P fires this via prefix-g)
bind-key g run-shell "~/.config/tmux/switch-session.sh"

# Copy mode (mnemonic match for Cmd-F)
bind-key f copy-mode

# tmux's default `prefix f` (find-window) moved to capital F
bind-key F command-prompt -p index "find-window -Z '%%'"

# Root-table navigation: when nvim is the foreground process, pass the key
# through (so smart-splits can move between nvim splits); otherwise select
# the tmux pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

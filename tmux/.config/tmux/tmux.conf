# Tibor's Tmux configuration.

# Prefix: Ctrl-Space
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Reload config.
bind-key r source-file ~/.config/tmux/tmux.conf

# Force a client redraw (Tmux's default `prefix r`, relocated to capital R).
bind-key R refresh-client

# Use vi mode
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Use v to start selection (alongside default Space)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

# Use y to yank selection (alongside default Return)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Disable ESC key delay
set -sg escape-time 0

# Focus events
set -g focus-events on

# Set window title to current working directory
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{s/zsh//:pane_current_command},#{s/zsh//:pane_current_command},#{b:pane_current_path}}'

# Set clipboard
set-option -s set-clipboard on

# Enable mouse mode for full mouse support (single click: select pane, double
# click: select word, triple click: select line, drag borders: resize panes)
set -g mouse on

# Configure word separators explicitly so double-click word selection behaves
# identically in Tmux and every terminal client.
set -g word-separators ",│\`|:\"' ()[]{}<>\t"

# Override default double/triple-click behavior to reduce flash time
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.05 ; send-keys -X copy-pipe-and-cancel }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.05 ; send-keys -X copy-pipe-and-cancel }

# Increase scrollback buffer size
set -g history-limit 10000

# Start numbering windows and panes at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Enable WM window titles for easier switching
set-option -g set-titles on
set-option -g set-titles-string '[#S] #T'

# Enable colourful terminal
set -s default-terminal 'tmux-256color'

# Rebuild repository-owned terminal capabilities on every config load.
set -su terminal-overrides
set -su terminal-features
set -as terminal-overrides ',xterm-ghostty:RGB'
set -as terminal-overrides ',xterm-kitty:RGB'

# Let applications opt into receiving extended modified keys. Keep `always`
# disabled: it exposes Shift-Space to legacy shells and activates unsafe
# xterm-form Shift-Tab and kitty report-all-key fallbacks.
#
# Tmux requests modifyOtherKeys for the client lifetime: mode 1 before 3.5 and
# mode 2 thereafter. Modern versions downconvert keys for ordinary panes.
set -sq extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'
set -as terminal-features ',xterm-kitty:extkeys'

# Tmux 3.5 added selectable formats and defaults to xterm, so retain CSI-u.
set -sq extended-keys-format csi-u

# Before 3.5, Tmux cannot downconvert forced CSI-u keys for ordinary panes.
# The missing format option is a capability proxy for that key-handling path.
# Normalize Space and Enter for safe basic input; opted-in applications also
# lose those shifted variants. Shift-Tab needs no fallback because mode 1
# retains its conventional encoding.
%if #{==:#{extended-keys-format},}
bind-key -n S-Space send-keys Space
bind-key -n S-Enter send-keys Enter
%endif

# Optional local themes.
source-file -q ~/.config/tmux/theme-light.conf
# Local override generated by theme-toggle; absent on a fresh installation.
source-file -q ~/.config/tmux/theme-current.conf

# Status bar positioning and layout
set-option -g status-position top
set-option -g status-justify left
set-option -g status-left-length 120
set-option -g window-status-format '#I:#W#F'
set-option -g window-status-current-format '#I:#W#F'

# Group alerting sessions beside the current session; prefix-i jumps to one.
set-option -g status-left '[#S#{S:#{?#{&&:#{session_alerts},#{!=:#{session_name},#{client_session}}}, #[reverse]#{session_name}!#[default],}}] '
set-option -g status-right '#h'
set-option -g status-interval 5

# Switch to last known session when exiting
set-option -g detach-on-destroy off

# Switch cursor to block in copy mode, restore beam when leaving
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'
set-hook -g pane-mode-changed 'if-shell -F "#{pane_in_mode}" "set -q cursor-style block" "set -q cursor-style bar"'

# Sessions: choose or return to the last session.
bind-key p run-shell "~/.config/tmux/switch-session.sh"
bind-key s switch-client -l
bind-key i run-shell "~/.config/tmux/jump-alert.sh"

# Windows: open in the same directory; move a pane into its own window.
bind-key c new-window -c '#{pane_current_path}'
bind-key t new-window -c '#{pane_current_path}'
bind-key T break-pane

# Windows: select, cycle, and reorder.
bind-key 0 last-window
bind-key [ previous-window
bind-key ] next-window
bind-key '{' swap-window -d -s : -t -1
bind-key '}' swap-window -d -s : -t +1

# Panes: focus with prefix-hjkl, preserving zoom.
bind-key h select-pane -ZL
bind-key j select-pane -ZD
bind-key k select-pane -ZU
bind-key l select-pane -ZR

# Panes: directional swap with prefix-Shift-hjkl
bind-key H swap-pane -Z -s '{left-of}'
bind-key J swap-pane -Z -s '{down-of}'
bind-key K swap-pane -Z -s '{up-of}'
bind-key L swap-pane -Z -s '{right-of}'

# Panes: choose across all sessions.
bind-key g run-shell "~/.config/tmux/select-pane.sh"

# Panes: resize with prefix-arrows (repeatable)
bind-key -r Up    resize-pane -U 3
bind-key -r Down  resize-pane -D 3
bind-key -r Left  resize-pane -L 5
bind-key -r Right resize-pane -R 5

# Panes: rebalance to an even grid
bind-key = select-layout tiled

# Panes: open splits in same directory
bind-key -r | split-window -h -c '#{pane_current_path}'
bind-key -r - split-window -v -c '#{pane_current_path}'

# Scrollback and paste buffer.
bind-key f copy-mode
bind-key v paste-buffer

# Tibor's Tmux dark theme based on Gruvbox dark.

# Pane styles for active vs inactive panes. The inactive background is
# hand-tuned against the terminal theme and mirrored by Neovim's NormalNC. The
# active background repeats the configured terminal background because OSC 11
# can report a stale colour after a theme toggle.
set-option -g window-style 'fg=#bdae93,bg=#282726'
set-option -g window-active-style 'fg=#ebdbb2,bg=#100f0f'

# Copy mode and error messages (dark fg works on orange bg)
set-window-option -g mode-style 'fg=#282828,bg=#fe8019'
set-option -g message-style 'fg=#282828,bg=#fe8019'

# Pane indicators in Gruvbox dark theme
set-option -g display-panes-active-colour '#ebdbb2'
set-option -g display-panes-colour '#5a524c'

# Pane borders in Gruvbox dark theme
set -g pane-border-style fg='#5a524c',bg=default
set -g pane-active-border-style fg='#689d6a',bg=default

# Status bar using gentle Gruvbox dark green
set-option -g status-style bg=default,fg='#689d6a'
set-option -g window-status-style fg='#689d6a'
set-option -g window-status-current-style fg='#689d6a',bold

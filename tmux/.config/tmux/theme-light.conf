# Tibor's tmux light theme based on Gruvbox light.

# Pane styles for active vs inactive panes. The inactive background is hand-tuned
# against Alacritty's primary background and mirrored by Neovim's NormalNC. The
# active background repeats Alacritty's literally: tmux's "terminal" would report
# a stale colour over OSC 11 after a theme toggle.
set-option -g window-style 'fg=#665c54,bg=#e6e4d9'
set-option -g window-active-style 'fg=#3c3836,bg=#fffcf0'

# Copy mode and error messages (light fg works on orange bg)
set-window-option -g mode-style 'fg=#f9f5d7,bg=#fe8019'
set-option -g message-style 'fg=#f9f5d7,bg=#fe8019'

# Pane indicators in gruvbox light theme
set-option -g display-panes-active-colour '#3c3836'
set-option -g display-panes-colour '#d5c4a1'

# Pane borders in gruvbox light theme
set -g pane-border-style fg='#d5c4a1',bg=default
set -g pane-active-border-style fg='#689d6a',bg=default

# Status bar using gentle gruvbox green
set-option -g status-style bg=default,fg='#689d6a'
set-option -g window-status-style fg='#689d6a'
set-option -g window-status-current-style fg='#689d6a',bold

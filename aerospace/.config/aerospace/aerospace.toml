# Tibor's Aerospace configuration.

# Config version
config-version = 2

# Start at login
start-at-login = true

# Normalizations keep the layout tree predictable as windows come and go.
# Side effect: `move` re-balances neighbours, so swap-ratio is not preserved.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 10 px sliver of neighbours in accordion mode — a subtle navigation cue
# without materially reducing the focused window's usable space.
accordion-padding = 10

# Default root layout for new workspaces
default-root-container-layout = 'accordion'

# Horizontal accordion mirrors i3's tabbed layout and favours H/L navigation.
default-root-container-orientation = 'horizontal'

# Mouse follows focus across monitors (only when the monitor changes).
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Neutralise macOS Cmd-H so apps never vanish silently.
automatically-unhide-macos-hidden-apps = true

# Declare persistent workspaces
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Keyboard preset (qwerty / dvorak)
[key-mapping]
preset = 'qwerty'

# No gaps — every pixel for windows.
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Alt owns the Aerospace keyspace. Digits address workspaces, HJKL address
# directions, Shift+letters address applications, and Space enters service mode.
[mode.main.binding]

# Enter service mode for layout, window-state, picker, and multi-monitor actions.
alt-space = 'mode service'

# Focus neighbour (wraps at workspace edges)
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# Move window in layout
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize in the same directions (mirrors i3 Mod+Ctrl+HJKL).
ctrl-alt-h = 'resize width -50'
ctrl-alt-j = 'resize height -50'
ctrl-alt-k = 'resize height +50'
ctrl-alt-l = 'resize width +50'

# Workspaces (0 = back-and-forth to previous workspace)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace-back-and-forth'
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# Focus an existing app wherever it is; absent apps are not launched.
# H/J/K/L stay reserved for directional focus and movement.
alt-shift-b = 'exec-and-forget ~/.config/aerospace/focus-app.sh --prefer-title "Google Chrome – work" "Google Chrome"'
alt-shift-c = 'exec-and-forget ~/.config/aerospace/focus-app.sh Calendar'
alt-shift-f = 'exec-and-forget ~/.config/aerospace/focus-app.sh Finder'
alt-shift-m = 'exec-and-forget ~/.config/aerospace/focus-app.sh Mattermost'
alt-shift-s = 'exec-and-forget ~/.config/aerospace/focus-app.sh Slack'
alt-shift-t = 'exec-and-forget ~/.config/aerospace/focus-app.sh Alacritty'
alt-shift-w = 'exec-and-forget ~/.config/aerospace/focus-app.sh "WhatsApp Web"'
alt-shift-x = 'exec-and-forget ~/.config/aerospace/focus-app.sh X'
alt-shift-y = 'exec-and-forget ~/.config/aerospace/focus-app.sh YouTube'
alt-shift-z = 'exec-and-forget ~/.config/aerospace/focus-app.sh --prefer-title "Zoom Meeting" Zoom'

# Service mode: entered with Alt-Space; most single-key actions auto-exit.
# Volume up/down remain in service mode so they can be repeated.
[mode.service.binding]
esc = 'mode main'
shift-r = ['reload-config', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Layout / window-state
m = ['layout accordion horizontal vertical', 'mode main'] # monocle (accordion) family; invoke again to rotate
t = ['layout tiles horizontal vertical', 'mode main'] # tiled family; invoke again to rotate
x = [
  'exec-and-forget osascript -e "tell application \"System Events\" to keystroke \"q\" using {control down, command down}"',
  'mode main',
] # lock screen
z = ['fullscreen', 'mode main']
f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
r = ['flatten-workspace-tree', 'mode main'] # reset layout
b = ['balance-sizes', 'mode main']

# Window selection
g = [
  'exec-and-forget osascript -e "tell application \"System Events\" to key code 48 using {option down}"',
  'mode main',
] # Raycast app/window picker
n = ['exec-and-forget ~/.config/aerospace/focus-next-window.sh', 'mode main'] # cycle windows of focused app globally

# Multi-monitor
o = ['move-workspace-to-monitor --wrap-around next', 'mode main']
a = [
  'exec-and-forget ~/.config/aerospace/swap-monitor-workspaces.sh',
  'mode main',
]
left = ['focus-monitor --wrap-around prev', 'mode main']
right = ['focus-monitor --wrap-around next', 'mode main']

# Joins live in service mode because Alt-H/J/K/L are focus bindings.
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

# Volume
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

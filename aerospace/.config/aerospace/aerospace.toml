# Tibor's Aerospace configuration.

# Start at login
start-at-login = true

# Normalizations keep the layout tree predictable as windows come and go.
# Side effect: `move` re-balances neighbours, so swap-ratio is not preserved.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 30 px sliver of neighbours in accordion mode — enough orientation cue
# when one window is "monocled" via Hyper-Enter.
accordion-padding = 30

# Default root layout for new workspaces
default-root-container-layout = 'tiles'

# Default root orientation ('auto' = horizontal on wide monitors, vertical on tall ones)
default-root-container-orientation = 'auto'

# Mouse follows focus across monitors (only when the monitor changes).
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Neutralise macOS Cmd-H so apps never vanish silently.
automatically-unhide-macos-hidden-apps = true

# Keyboard preset (qwerty / dvorak)
[key-mapping]
preset = 'qwerty'

# No gaps — every pixel for windows.
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Hyper (⌃⌥⌘, via Karabiner-mapped Caps Lock) is the primary Aerospace modifier.
# Plain Alt remains free except for the numeric workspace aliases below.
[mode.main.binding]

# Enter service mode (layout / lock / fullscreen / multi-monitor)
ctrl-alt-cmd-space = 'mode service'

# Focus neighbour (wraps at workspace edges)
ctrl-alt-cmd-h = 'focus --boundaries-action wrap-around-the-workspace left'
ctrl-alt-cmd-j = 'focus --boundaries-action wrap-around-the-workspace down'
ctrl-alt-cmd-k = 'focus --boundaries-action wrap-around-the-workspace up'
ctrl-alt-cmd-l = 'focus --boundaries-action wrap-around-the-workspace right'

# Move window in layout
ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'

# Resize: minus/equal by key position; arrows mirror tmux prefix-arrows.
ctrl-alt-cmd-minus = 'resize smart -50'
ctrl-alt-cmd-equal = 'resize smart +50'
ctrl-alt-cmd-up = 'resize height +50'
ctrl-alt-cmd-down = 'resize height -50'
ctrl-alt-cmd-right = 'resize width +50'
ctrl-alt-cmd-left = 'resize width -50'

# Workspaces (0 = back-and-forth to previous workspace)
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'
ctrl-alt-cmd-7 = 'workspace 7'
ctrl-alt-cmd-8 = 'workspace 8'
ctrl-alt-cmd-9 = 'workspace 9'
ctrl-alt-cmd-0 = 'workspace-back-and-forth'

# Move window to workspace and follow it there
ctrl-alt-cmd-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
ctrl-alt-cmd-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
ctrl-alt-cmd-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
ctrl-alt-cmd-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
ctrl-alt-cmd-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
ctrl-alt-cmd-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
ctrl-alt-cmd-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
ctrl-alt-cmd-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
ctrl-alt-cmd-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# Named (mnemonic) app workspaces — auto-assigned via on-window-detected
ctrl-alt-cmd-b = 'workspace B' # Browser (Chrome)
ctrl-alt-cmd-c = 'workspace C' # Calendar
ctrl-alt-cmd-e = 'workspace E' # Emacs
ctrl-alt-cmd-f = 'workspace F' # Finder / Firefox
ctrl-alt-cmd-m = 'workspace M' # Mattermost
ctrl-alt-cmd-p = 'workspace P' # Preview
ctrl-alt-cmd-s = 'workspace S' # Slack / Safari
ctrl-alt-cmd-t = 'workspace T' # Terminal (Alacritty)
ctrl-alt-cmd-w = 'workspace W' # WhatsApp
ctrl-alt-cmd-x = 'workspace X' # X / Bluesky
ctrl-alt-cmd-y = 'workspace Y' # YouTube
ctrl-alt-cmd-z = 'workspace Z' # Zoom

# Move window to named workspace + follow
ctrl-alt-cmd-shift-b = ['move-node-to-workspace B', 'workspace B']
ctrl-alt-cmd-shift-c = ['move-node-to-workspace C', 'workspace C']
ctrl-alt-cmd-shift-e = ['move-node-to-workspace E', 'workspace E']
ctrl-alt-cmd-shift-f = ['move-node-to-workspace F', 'workspace F']
ctrl-alt-cmd-shift-m = ['move-node-to-workspace M', 'workspace M']
ctrl-alt-cmd-shift-p = ['move-node-to-workspace P', 'workspace P']
ctrl-alt-cmd-shift-s = ['move-node-to-workspace S', 'workspace S']
ctrl-alt-cmd-shift-t = ['move-node-to-workspace T', 'workspace T']
ctrl-alt-cmd-shift-w = ['move-node-to-workspace W', 'workspace W']
ctrl-alt-cmd-shift-x = ['move-node-to-workspace X', 'workspace X']
ctrl-alt-cmd-shift-y = ['move-node-to-workspace Y', 'workspace Y']
ctrl-alt-cmd-shift-z = ['move-node-to-workspace Z', 'workspace Z']

# Plain-Alt workspace aliases (shadow Emacs M-[0-9])
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace-back-and-forth'
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# App/window picker: replay the existing Raycast Option-Tab hotkey.
ctrl-alt-cmd-g = 'exec-and-forget osascript -e "tell application \"System Events\" to key code 48 using {option down}"'

# Misc window management
ctrl-alt-cmd-n = 'exec-and-forget ~/.config/aerospace/focus-next-window.sh' # cycle windows of same app globally
ctrl-alt-cmd-enter = 'layout tiles accordion'                              # monocle toggle; preserves orientation & per-child ratios
ctrl-alt-cmd-slash = 'layout h_tiles v_tiles'                              # toggle container orientation (trial)
ctrl-alt-cmd-backslash = 'layout h_tiles v_tiles'                          # same, alt key for muscle-memory

# Service mode: entered with Hyper-Space; most single-key actions auto-exit.
# Volume up/down remain in service mode so they can be repeated.
[mode.service.binding]
esc = 'mode main'
r = ['reload-config', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Layout / window-state
x = [
  'exec-and-forget osascript -e "tell application \"System Events\" to keystroke \"q\" using {control down, command down}"',
  'mode main',
] # lock screen
z = ['fullscreen', 'mode main']
f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
s = ['layout v_tiles', 'mode main'] # split   (vim :split  — stacked)
v = ['layout h_tiles', 'mode main'] # vsplit  (vim :vsplit — side by side)
b = ['balance-sizes', 'mode main']
t = ['flatten-workspace-tree', 'mode main'] # tidy/reset layout

# Multi-monitor (arrows live here because they are resize in main mode)
o = ['move-workspace-to-monitor --wrap-around next', 'mode main']
a = [
  'exec-and-forget ~/.config/aerospace/swap-monitor-workspaces.sh',
  'mode main',
]
left = ['focus-monitor --wrap-around prev', 'mode main']
right = ['focus-monitor --wrap-around next', 'mode main']

# Joins live in service mode because Hyper-h/j/k/l are focus bindings.
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

# Volume
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# Auto-assign newly-detected windows to their named workspace.
# Manually-moved windows (Hyper+Shift+<letter>) are NOT re-routed — they stay where you put them.
# To verify an app's exact name: aerospace list-apps
[[on-window-detected]]
if.app-name-regex-substring = '^Google Chrome$'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-name-regex-substring = '^Calendar$'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-name-regex-substring = '^Emacs$'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-name-regex-substring = '^Finder$'
run = 'move-node-to-workspace F'

[[on-window-detected]]
if.app-name-regex-substring = '^Firefox$'
run = 'move-node-to-workspace F'

[[on-window-detected]]
if.app-name-regex-substring = '^Mattermost$'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-name-regex-substring = '^Preview$'
run = 'move-node-to-workspace P'

[[on-window-detected]]
if.app-name-regex-substring = '^Safari$'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-name-regex-substring = '^Slack$'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-name-regex-substring = '^Alacritty$'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-name-regex-substring = '^WhatsApp Web$'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-name-regex-substring = '^Bluesky$'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-name-regex-substring = '^X$'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-name-regex-substring = '^YouTube$'
run = 'move-node-to-workspace Y'

[[on-window-detected]]
if.app-name-regex-substring = '^Zoom$'
run = 'move-node-to-workspace Z'

# Tibor's Kitty configuration.

# Start the default session with shell integration.
shell /bin/zsh --login
shell_integration enabled
startup_session sessions/dotfiles.kitty-session

# Set locale.
env LANG=en_GB.UTF-8
env LC_ALL=en_GB.UTF-8

# Clear inherited Tmux identifiers.
# Keep local multiplexer detection correct when launching from Tmux.
env TMUX
env TMUX_PANE

# Identify Kitty to terminal applications.
env TERM_PROGRAM=kitty

# Set terminal font.
font_family      family="Iosevka Term" style=Regular
bold_font        family="Iosevka Term" style=Bold
italic_font      family="Iosevka Term" style=Italic
bold_italic_font family="Iosevka Term" style="Bold Italic"
font_size 18

# Disable ligatures.
disable_ligatures always

# Tune text rendering.
modify_font cell_height 98%
text_composition_strategy 1.5 25

# Keep faint text legible.
dim_opacity 0.7

# Use Nerd Font symbols.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Use a steady bar cursor.
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0

# Set window padding.
window_padding_width 4

# Fade inactive text only when multiple panes are visible.
inactive_text_alpha -0.70

# Set pane border colours.
active_border_color #689d6a
inactive_border_color #928374

# Show OS window focus in the project tab bar to save the native titlebar row.
hide_window_decorations titlebar-only
macos_show_window_title_in none

# Treat Option as Alt.
macos_option_as_alt both

# Quit when the last window closes.
macos_quit_when_last_window_closed yes

# Confirm before closing sessions or quitting.
confirm_os_window_close 1

# Keep default rendering delays and display synchronization.
input_delay 3
repaint_delay 10
sync_to_monitor yes

# Load the light theme and current override.
include themes/theme-light.conf
globinclude themes/theme-current.conf

# Open scrollback in Neovim.
# Cmd-F provides a searchable, yankable snapshot of the pager history.
scrollback_lines 10000
scrollback_pager_history_size 10
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Use splits with stack for Cmd-Z zoom.
enabled_layouts splits,stack

# Limit tabs to the active session.
# Do not use session:~:
# Cmd-P/S/G/I focus windows by ID without updating Kitty's goto-session history,
# so ~ can match a stale session and migrate tab navigation into it. There
# should be no unassigned tabs; session:^$ remains visible so leakage is loud.
tab_bar_filter session:. or session:^$
# Keep session focus when closing a tab; remove once Kitty fixes the bug.
watcher session-focus.py
tab_bar_edge top
tab_bar_margin_width 4
tab_bar_margin_height 6 0
# Red/yellow/green circles mean focused; three grey circles mean unfocused.
# Unfocused circles and tab text use the theme's grey foreground (color8).
tab_bar_style custom
tab_separator " "
tab_bar_min_tabs 1

# Set tab titles and font styles.
# Show @program, adding /directory when session directories differ.
# Idle shells show directories; Cmd-G includes Neovim filenames.
tab_title_template "{index}:{title}"
active_tab_font_style bold
inactive_tab_font_style normal

# Show bell alerts without sound.
# Cmd-I visits background alerts; focusing a pane clears its alert.
# The custom tab bar replaces the bell symbol with a reverse-colour marker.
enable_audio_bell no
visual_bell_duration 0.15
window_alert_on_bell yes
bell_on_tab "! "

# Enable socket-based remote control for smart-splits.nvim.
# Socket-only denies in-band remote control; do not forward the socket over SSH.
allow_remote_control socket-only
listen_on unix:kitty-{kitty_pid}

# Keep only explicit shortcuts.
clear_all_shortcuts yes

# Application and clipboard shortcuts.
# Cmd-C copies and clears a selection; otherwise it passes through.
map cmd+c combine : copy_or_noop : clear_selection
map cmd+v paste_from_clipboard
map cmd+w close_session .
map cmd+q quit
map cmd+shift+, load_config_file

# Control clipboard access.
copy_on_select no
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append

# Adjust font size.
# Cmd-0 remains the alternate-tab shortcut.
map cmd+equal change_font_size all +1
map cmd+plus change_font_size all +1
map cmd+shift+equal change_font_size all +1
map cmd+minus change_font_size all -1
map cmd+shift+0 change_font_size all 0

# Preserve Shift-Enter for terminal applications.
map shift+enter send_text all \x1b[13;2u

# Manage sessions and tabs.
# Cmd-P selects active sessions with immediate unique-prefix acceptance.
# Cmd-N offers templates or new names; Option-Enter forces the typed name.
# Inherit the current session; plain new_tab/new_window create unassigned tabs.
map cmd+p launch --type=overlay --cwd=current --add-to-session . /bin/zsh --login -c "exec ~/.config/kitty/session-picker.sh switch"
map cmd+n launch --type=overlay --cwd=current --add-to-session . /bin/zsh --login -c "exec ~/.config/kitty/session-picker.sh new"
map cmd+s launch --type=background --allow-remote-control /bin/zsh --login -c "exec ~/.config/kitty/session-picker.sh last"
map cmd+t new_tab_with_cwd
map cmd+0 goto_tab -1
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# Stop at the first and last visible tabs, matching directional pane focus.
map cmd+[ kitten focus-tab.py -1
map cmd+] kitten focus-tab.py 1
map cmd+shift+[ move_tab_backward
map cmd+shift+] move_tab_forward

# Manage panes.
# Cmd-G selects panes across all sessions; --add-to-session keeps membership.
# Cmd-Z toggles the stack layout; the tab bar marks zoom with a trailing Z.
# Cmd-Shift-T moves the pane into its own tab.
map cmd+d launch --cwd=current --location=vsplit --add-to-session .
map cmd+shift+d launch --cwd=current --location=hsplit --add-to-session .
map cmd+shift+t detach_window new-tab
map cmd+g launch --type=overlay --cwd=current --add-to-session . /bin/zsh --login -c "exec ~/.config/kitty/session-picker.sh pane"
map cmd+z toggle_layout stack
map cmd+f show_scrollback
map cmd+i remote_control !focus-window --match state:needs_attention

# Rearrange and resize splits.
# Cmd-R enters a persistent H/J/K/L or arrow-key resize mode that ignores other keys.
# R resets sizes, 0 or = equalizes splits, and Escape or Cmd-R exits.
map cmd+shift+h move_window left
map cmd+shift+j move_window down
map cmd+shift+k move_window up
map cmd+shift+l move_window right
map cmd+shift+left move_window left
map cmd+shift+down move_window down
map cmd+shift+up move_window up
map cmd+shift+right move_window right
map cmd+shift+r layout_action rotate
map --new-mode resize --on-unknown ignore cmd+r
map --mode resize h resize_window narrower 5
map --mode resize j resize_window taller 3
map --mode resize k resize_window shorter 3
map --mode resize l resize_window wider 5
map --mode resize left resize_window narrower 5
map --mode resize down resize_window taller 3
map --mode resize up resize_window shorter 3
map --mode resize right resize_window wider 5
map --mode resize r resize_window reset
map --mode resize 0 layout_action equalize
map --mode resize equal layout_action equalize
map --mode resize cmd+r pop_keyboard_mode
map --mode resize esc pop_keyboard_mode

# Navigate Kitty and Neovim panes.
# smart-splits sets IS_NVIM so Ctrl-H/J/K/L pass through in Neovim.
# Ctrl-arrow keys send the corresponding Ctrl-H/J/K/L in Neovim.
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map ctrl+left neighboring_window left
map ctrl+down neighboring_window down
map ctrl+up neighboring_window up
map ctrl+right neighboring_window right
map ctrl+backslash nth_window -1
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l
map --when-focus-on var:IS_NVIM ctrl+left send_key ctrl+h
map --when-focus-on var:IS_NVIM ctrl+down send_key ctrl+j
map --when-focus-on var:IS_NVIM ctrl+up send_key ctrl+k
map --when-focus-on var:IS_NVIM ctrl+right send_key ctrl+l
map --when-focus-on var:IS_NVIM ctrl+backslash

# Focus panes with Cmd-H/J/K/L or Cmd-arrow keys.
# Karabiner sends F18 for Cmd-H to prevent macOS from hiding Kitty.
map f18 neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right
map cmd+left neighboring_window left
map cmd+down neighboring_window down
map cmd+up neighboring_window up
map cmd+right neighboring_window right
map --when-focus-on var:IS_NVIM f18 send_key ctrl+h
map --when-focus-on var:IS_NVIM cmd+j send_key ctrl+j
map --when-focus-on var:IS_NVIM cmd+k send_key ctrl+k
map --when-focus-on var:IS_NVIM cmd+l send_key ctrl+l
map --when-focus-on var:IS_NVIM cmd+left send_key ctrl+h
map --when-focus-on var:IS_NVIM cmd+down send_key ctrl+j
map --when-focus-on var:IS_NVIM cmd+up send_key ctrl+k
map --when-focus-on var:IS_NVIM cmd+right send_key ctrl+l

# Select text with Cmd-Y hints.
# Lowercase u opens a URL; uppercase U and other actions copy the selection.
# F copies paths, stopping at whitespace or : before rg line numbers.
# Each complete hint selects immediately, without Space/Enter to disambiguate.
action_alias hints kitten hints --prefix-free
map cmd+y>u hints --type=url --program default
map cmd+y>shift+u hints --type=url --program @
map cmd+y>w hints --type=word --program @
map cmd+y>h hints --type=regex --regex '(?<![0-9A-Fa-f])((?:[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12})|(?:[0-9A-Fa-f]{7,64}))(?![0-9A-Fa-f])' --program @
map cmd+y>f hints --type=regex --regex '[^\s:]*[/.][^\s:]+' --program @
map cmd+y>k hints --type=regex --regex '(?:^|\s)([a-z0-9](?:[a-z0-9.-]*[a-z0-9])?)(?=\s+\d+/\d+\s+)' --program @
map cmd+y>l hints --type=line --program @

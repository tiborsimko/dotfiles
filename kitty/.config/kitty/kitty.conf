# Tibor's Kitty configuration.

# Start every OS window as a Tmux client. Unset TMUX so Cmd-N also works when
# invoked from a window that is already attached to Tmux.
shell /bin/zsh -l -c "exec env -u TMUX tmux new-session"
shell_integration disabled

env LANG=en_GB.UTF-8
env LC_ALL=en_GB.UTF-8

# Set terminal font.
font_family      family="Iosevka Term" style=Regular
bold_font        family="Iosevka Term" style=Bold
italic_font      family="Iosevka Term" style=Italic
bold_italic_font family="Iosevka Term" style="Bold Italic"
font_size 18

# Disable ligatures.
disable_ligatures always

# Slightly tighten Iosevka's native line spacing while preserving descenders.
modify_font cell_height 98%

# Slightly soften Kitty's macOS text rendering.
text_composition_strategy 1.5 25

# Keep SGR faint text legible while retaining a distinction from normal text.
dim_opacity 0.7

# Prefer Kitty's bundled symbols even when patched fonts are also installed.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

cursor_shape beam
# Use a 2pt beam cursor at this font size so it remains readable on a Retina
# display.
cursor_beam_thickness 2.0
cursor_blink_interval 0

window_padding_width 4
hide_window_decorations titlebar-only
macos_show_window_title_in none
macos_option_as_alt both

# Tmux owns persistent layout and session state.
macos_quit_when_last_window_closed yes

# Guard against closing a window or quitting Kitty by accident.
confirm_os_window_close 1

# Keep the safe macOS default. For a latency-only A/B test, swap this block for
# the low-latency one below; it removes synchronisation but can tear and costs
# more power.
input_delay 3
repaint_delay 10
sync_to_monitor yes
# input_delay 0
# repaint_delay 8
# sync_to_monitor no

# Start with the light palette; theme-toggle installs theme-current and reloads
# running Kitty instances. globinclude tolerates the file being absent.
include themes/theme-light.conf
globinclude themes/theme-current.conf

# Kitty's native tabs, windows, layouts, and scrollback would compete with Tmux.
# Clear every default binding, then restore only deliberate macOS application
# actions and Tmux forwarding bindings below.
clear_all_shortcuts yes

# macOS application and clipboard actions.
# Copy a selection, otherwise let Cmd-C reach Tmux or its foreground program.
map cmd+c copy_or_noop
map cmd+v paste_from_clipboard
map cmd+n new_os_window
map cmd+w close_os_window
map cmd+q quit
map cmd+shift+, load_config_file

# Copy native mouse selections and show them with reverse video.
copy_on_select clipboard
selection_foreground none
selection_background none

# Avoid Kitty's OSC 52 append extension.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append

# Font size (Cmd-0 remains reserved for Tmux's alternate window).
map cmd+equal change_font_size all +1
map cmd+plus change_font_size all +1
map cmd+shift+equal change_font_size all +1
map cmd+minus change_font_size all -1
map cmd+shift+0 change_font_size all 0

# Send a distinct Shift+Return sequence for terminal apps that support
# modified keys, including Codex's shift-enter keymap.
map shift+enter send_text all \x1b[13;2u

# Tmux-Fingers picker table (Cmd-Y -> Prefix-y).
map cmd+y send_text all \x00y

# Tmux sessions and windows. Tmux's prefix is Ctrl-Space (NUL, \x00).
map cmd+s send_text all \x00s
map cmd+p send_text all \x00p
map cmd+i send_text all \x00I
map cmd+t send_text all \x00t
map cmd+0 send_text all \x000
map cmd+1 send_text all \x001
map cmd+2 send_text all \x002
map cmd+3 send_text all \x003
map cmd+4 send_text all \x004
map cmd+5 send_text all \x005
map cmd+6 send_text all \x006
map cmd+7 send_text all \x007
map cmd+8 send_text all \x008
map cmd+9 send_text all \x009
map cmd+[ send_text all \x00(
map cmd+] send_text all \x00)
map cmd+shift+[ send_text all \x00N
map cmd+shift+] send_text all \x00n

# Tmux panes.
map cmd+d send_text all \x00|
map cmd+shift+d send_text all \x00-
map f18 send_text all \x08
map cmd+j send_text all \x0a
map cmd+k send_text all \x0b
map cmd+l send_text all \x0c
map cmd+g send_text all \x00g
map cmd+z send_text all \x00z
map cmd+f send_text all \x00f

# Tibor's Kitty dark theme using Gruvbox dark hard colours with a Flexoki background.

# Set background and foreground colours.
background #100f0f
foreground #ebdbb2

# Set cursor colours.
cursor     #ffffff
cursor_text_color #100f0f

# Set selection colours.
selection_foreground none
selection_background #665c54

# Set tab bar colours.
tab_bar_background #100f0f
active_tab_background #100f0f
inactive_tab_background #100f0f
active_tab_foreground #689d6a
inactive_tab_foreground #689d6a

# Set the ANSI palette.
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
